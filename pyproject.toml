[project]
name = "downloader"
version = "0.1.0"
description = "A shell wrapped around yt-dlp to make downloading bulk files easer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "python-dateutil>=2.9.0.post0",
    "six>=1.17.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
downloader = "downloader:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
